<!DOCTYPE html>
<html>

<head>

<title>Admin Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>


<body class="bg-light">


<div class="container mt-5">


<h1 class="text-center">
📋 Candidate Dashboard
</h1>


<table class="table table-bordered table-striped mt-4">


<tr>
<th>ID</th>
<th>Name</th>
<th>Role</th>
<th>Score</th>
<th>Experience</th>
<th>Status</th>
</tr>



{% for c in candidates %}


<tr>

<td>{{ c[0] }}</td>

<td>{{ c[1] }}</td>

<td>{{ c[2] }}</td>

<td>{{ c[3] }}%</td>

<td>{{ c[4] }} Years</td>

<td>{{ c[5] }}</td>

</tr>


{% endfor %}



</table>


</div>


</body>

</html>
